<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melvin</title>
  <link rel="stylesheet" href="style.css">
  <!--
    Schriftarten:
    - Orbitron: Futuristische Monospace-Schrift für Titel und Labels
    - Rajdhani: Klare, moderne Schrift für Fließtext und Antworten
  -->
  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap"
    rel="stylesheet"
  >
</head>
<body>

  <!-- Titelleiste – dient auch als Drag-Handle zum Verschieben des Fensters -->
  <div class="titlebar" id="titlebar">
    <span class="title-text">M.E.L.V.I.N</span>
    <button class="close-btn" id="closeBtn" title="Melvin beenden">✕</button>
  </div>

  <!-- Hauptinhalt -->
  <div class="container">

    <!-- Melvins animiertes Gesicht -->
    <div class="face-container">
      <div class="face" id="face">

        <!-- Scan-Linie animiert von oben nach unten über das Gesicht -->
        <div class="scanline"></div>

        <!-- Augen – Größe und Farbe ändern sich je nach Zustand -->
        <div class="eyes">
          <div class="eye left-eye" id="leftEye">
            <div class="pupil" id="leftPupil"></div>
            <div class="eye-glow"></div>
          </div>
          <div class="eye right-eye" id="rightEye">
            <div class="pupil" id="rightPupil"></div>
            <div class="eye-glow"></div>
          </div>
        </div>

        <!-- Mund – SVG-Pfad wird per JavaScript animiert -->
        <div class="mouth-container">
          <svg
            class="mouth-svg"
            id="mouthSvg"
            viewBox="0 0 100 30"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              id="mouthPath"
              d="M 20 15 Q 50 15 80 15"
              stroke="#00d4ff"
              stroke-width="2.5"
              fill="none"
              stroke-linecap="round"
            />
          </svg>
        </div>

        <!-- Wangen-LEDs – pulsierende Akzentpunkte -->
        <div class="cheek left-cheek"></div>
        <div class="cheek right-cheek"></div>

      </div>

      <!-- Äußerer Status-Ring – Farbe und Animation zeigen den Zustand an -->
      <div class="status-ring" id="statusRing"></div>
    </div>

    <!-- Zustandsanzeige unter dem Gesicht -->
    <div class="status-label" id="statusLabel">BEREIT</div>

    <!-- Antwort-Box – zeigt Melvins letzte Antwort mit Schreibmaschinen-Effekt -->
    <div class="response-box">
      <div class="response-text" id="responseText">
        Sage "Melvin" um zu starten...
      </div>
    </div>

    <!-- Audio-Visualizer – Balken animieren sich beim Sprechen und Zuhören -->
    <div class="visualizer" id="visualizer">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

  </div>

  <!--
    Eingabe-Overlay
    Wird eingeblendet wenn Python eine Nutzereingabe anfordert (z.B. Name, PIN).
    Unterstützt drei Modi: Texteingabe, PIN-Eingabe (maskiert), Ja/Nein-Bestätigung.
  -->
  <div class="input-overlay" id="inputOverlay">
    <div class="input-box">

      <!-- Prompt-Text der Python übermittelt -->
      <div class="input-prompt" id="inputPrompt">Eingabe erforderlich</div>

      <!-- Modus: Text- oder PIN-Eingabe -->
      <div class="input-field-wrap" id="inputFieldWrap">
        <input
          type="text"
          class="input-field"
          id="inputField"
          placeholder="Hier eingeben..."
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <!-- Modus: Ja/Nein-Bestätigung -->
      <div class="input-confirm-wrap" id="inputConfirmWrap">
        <button class="confirm-btn yes-btn" id="confirmYes">✓ Ja</button>
        <button class="confirm-btn no-btn"  id="confirmNo">✕ Nein</button>
      </div>

      <button class="input-submit-btn" id="inputSubmit">Bestätigen</button>

    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
