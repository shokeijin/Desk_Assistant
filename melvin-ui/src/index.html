<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melvin</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Titelleiste -->
  <div class="titlebar" id="titlebar">
    <span class="title-text">M.E.L.V.I.N</span>
    <button class="close-btn" id="closeBtn">✕</button>
  </div>

  <!-- Hauptcontainer -->
  <div class="container">

    <!-- Gesicht -->
    <div class="face-container">
      <div class="face" id="face">
        <div class="scanline"></div>
        <div class="eyes">
          <div class="eye left-eye" id="leftEye">
            <div class="pupil" id="leftPupil"></div>
            <div class="eye-glow"></div>
          </div>
          <div class="eye right-eye" id="rightEye">
            <div class="pupil" id="rightPupil"></div>
            <div class="eye-glow"></div>
          </div>
        </div>
        <div class="mouth-container">
          <svg class="mouth-svg" id="mouthSvg" viewBox="0 0 100 30" xmlns="http://www.w3.org/2000/svg">
            <path id="mouthPath" d="M 20 15 Q 50 15 80 15" stroke="#00d4ff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="cheek left-cheek"></div>
        <div class="cheek right-cheek"></div>
      </div>
      <div class="status-ring" id="statusRing"></div>
    </div>

    <!-- Status Text -->
    <div class="status-label" id="statusLabel">BEREIT</div>

    <!-- Antwort-Box -->
    <div class="response-box">
      <div class="response-text" id="responseText">Sage "Melvin" um zu starten...</div>
    </div>

    <!-- Visualizer -->
    <div class="visualizer" id="visualizer">
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
      <div class="bar"></div>
    </div>

  </div>

  <!-- ✅ EINGABE OVERLAY -->
  <div class="input-overlay" id="inputOverlay">
    <div class="input-box">
      <div class="input-prompt" id="inputPrompt">Eingabe erforderlich</div>

      <!-- Text / PIN Eingabe -->
      <div class="input-field-wrap" id="inputFieldWrap">
        <input
          type="text"
          class="input-field"
          id="inputField"
          placeholder="Hier eingeben..."
          autocomplete="off"
          spellcheck="false"
        />
      </div>

      <!-- Bestätigung (Ja/Nein) -->
      <div class="input-confirm-wrap" id="inputConfirmWrap">
        <button class="confirm-btn yes-btn" id="confirmYes">✓ Ja</button>
        <button class="confirm-btn no-btn" id="confirmNo">✕ Nein</button>
      </div>

      <button class="input-submit-btn" id="inputSubmit">Bestätigen</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
